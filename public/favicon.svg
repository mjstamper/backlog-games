<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="BacklogGames">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3d3d" />
      <stop offset="100%" stop-color="#142929" />
    </linearGradient>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="64" height="64" rx="10" fill="url(#bg)" />

  <!-- Tron grid -->
  <g stroke="#4a9a9a" stroke-width="0.6" opacity="0.45">
    <line x1="0" y1="52" x2="64" y2="52" />
    <line x1="0" y1="56" x2="64" y2="58" />
    <line x1="0" y1="60" x2="64" y2="64" />
    <line x1="8" y1="52" x2="32" y2="64" />
    <line x1="24" y1="52" x2="48" y2="64" />
    <line x1="40" y1="52" x2="64" y2="64" />
    <line x1="56" y1="52" x2="64" y2="58" />
  </g>

  <!-- Neon tube helper: parallel strokes -->
  <g filter="url(#neonGlow)" stroke="#f2ea4a" stroke-width="1.15" stroke-linecap="round">
    <!-- B -->
    <line x1="10" y1="14" x2="10" y2="46" />
    <line x1="12" y1="14" x2="12" y2="46" />
    <line x1="14" y1="14" x2="14" y2="46" />

    <line x1="10" y1="14" x2="22" y2="14" />
    <line x1="10" y1="16" x2="22" y2="16" />
    <line x1="10" y1="18" x2="22" y2="18" />

    <line x1="22" y1="14" x2="22" y2="28" />
    <line x1="24" y1="14" x2="24" y2="28" />
    <line x1="26" y1="14" x2="26" y2="28" />

    <line x1="10" y1="28" x2="24" y2="28" />
    <line x1="10" y1="30" x2="24" y2="30" />
    <line x1="10" y1="32" x2="24" y2="32" />

    <line x1="22" y1="32" x2="22" y2="46" />
    <line x1="24" y1="32" x2="24" y2="46" />
    <line x1="26" y1="32" x2="26" y2="46" />

    <line x1="10" y1="44" x2="22" y2="44" />
    <line x1="10" y1="46" x2="22" y2="46" />
    <line x1="10" y1="48" x2="22" y2="48" />

    <!-- G -->
    <line x1="36" y1="14" x2="50" y2="14" />
    <line x1="36" y1="16" x2="50" y2="16" />
    <line x1="36" y1="18" x2="50" y2="18" />

    <line x1="36" y1="14" x2="36" y2="46" />
    <line x1="38" y1="14" x2="38" y2="46" />
    <line x1="40" y1="14" x2="40" y2="46" />

    <line x1="36" y1="44" x2="50" y2="44" />
    <line x1="36" y1="46" x2="50" y2="46" />
    <line x1="36" y1="48" x2="50" y2="48" />

    <line x1="50" y1="30" x2="50" y2="46" />
    <line x1="52" y1="30" x2="52" y2="46" />
    <line x1="54" y1="30" x2="54" y2="46" />

    <line x1="44" y1="30" x2="54" y2="30" />
    <line x1="44" y1="32" x2="54" y2="32" />
    <line x1="44" y1="34" x2="54" y2="34" />
  </g>

  <!-- Warm neon bloom -->
  <g opacity="0.35" stroke="#ffe566" stroke-width="2.4" stroke-linecap="round">
    <line x1="12" y1="14" x2="12" y2="46" />
    <line x1="38" y1="14" x2="38" y2="46" />
  </g>
</svg>
